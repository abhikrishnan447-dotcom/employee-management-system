{% extends 'admin/base.html' %}{% block content %}<h2>Department Management</h2><form method="post" class="card card-body mb-4">{% csrf_token %}<input class="form-control mb-2" name="name" placeholder="Department name" required><textarea class="form-control mb-2" name="description" placeholder="Description"></textarea><button class="btn btn-primary">Add Department</button></form><table class="table bg-white"><tr><th>Name</th><th>Employees</th><th>Action</th></tr>{% for d in departments %}<tr><td>{{ d.name }}</td><td>{{ d.employee_count }}</td><td><form method="post" action="{% url 'department_delete' d.id %}">{% csrf_token %}<button class="btn btn-sm btn-danger">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
