{% extends 'admin/base.html' %}{% block content %}<h2>Task Management</h2><form method="post" action="{% url 'assign_task' %}" class="card card-body mb-4">{% csrf_token %}<div class="row g-2"><div class="col-md-6"><input class="form-control" name="title" placeholder="Task title" required></div><div class="col-md-3"><select class="form-select" name="assigned_to" required>{% for e in employees %}<option value="{{ e.id }}">{{ e.name }}</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" type="date" name="deadline" required></div><div class="col-md-4"><select class="form-select" name="department"><option value="">Department</option>{% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></div><div class="col-md-4"><select class="form-select" name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div><div class="col-12"><textarea class="form-control" name="description" placeholder="Description" required></textarea></div></div><button class="btn btn-primary mt-3">Assign Task</button></form><table class="table bg-white"><tr><th>Task</th><th>Employee</th><th>Deadline</th><th>Status</th><th>Progress</th></tr>{% for t in tasks %}<tr><td>{{ t.title }}</td><td>{{ t.assigned_to.name }}</td><td>{{ t.deadline }}</td><td>{{ t.status }}</td><td>{{ t.progress }}%</td></tr>{% empty %}<tr><td colspan="5">No tasks.</td></tr>{% endfor %}</table>{% endblock %}
