{% extends 'workspace/admin_base.html' %}
{% block title %}Edit Task | WorkSphere{% endblock %}
{% block content %}<div class="page-title mb-4"><h1>Edit Task</h1><p>Update task details and assigned employees.</p></div><div class="card-pro p-4"><form method="post" class="row g-3">{% csrf_token %}<div class="col-md-6"><label class="form-label">Task Title</label><input class="form-control" name="title" value="{{ task.title }}" required></div><div class="col-md-6"><label class="form-label">Employees</label><select class="form-select" name="assigned_to" multiple size="6" required>{% for employee in employees %}<option value="{{ employee.id }}" {% if employee in selected_employees %}selected{% endif %}>{{ employee.name }}</option>{% endfor %}</select><div class="form-text">Hold Ctrl to select multiple employees.</div></div><div class="col-md-6"><label class="form-label">Department</label><select class="form-select" name="department"><option value="">Select department</option>{% for department in departments %}<option value="{{ department.id }}" {% if task.department_id == department.id %}selected{% endif %}>{{ department.name }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Deadline</label><input class="form-control" type="date" name="deadline" value="{{ task.deadline|date:'Y-m-d' }}" required></div><div class="col-md-3"><label class="form-label">Priority</label><select class="form-select" name="priority"><option {% if task.priority == 'Low' %}selected{% endif %}>Low</option><option {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option><option {% if task.priority == 'High' %}selected{% endif %}>High</option></select></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="5" required>{{ task.description }}</textarea></div><div class="col-12 d-flex justify-content-between"><a class="btn btn-light" href="{% url 'task_management' %}">Cancel</a><button class="btn btn-primary">Save Changes</button></div></form></div>{% endblock %}
