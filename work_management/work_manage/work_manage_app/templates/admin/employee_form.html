{% extends 'admin/admin_base.html' %}{% block title %}Edit Employee | WorkSphere{% endblock %}{% block content %}<div class="page-title mb-4"><h1>Edit Employee</h1><p>Update employee details and department assignment.</p></div><div class="card-pro p-4"><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ employee.name }}" required></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" value="{{ employee.email }}" readonly><div class="form-text">Registered email cannot be changed by admin.</div></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ employee.phone }}" required></div><div class="col-md-6"><label class="form-label">Department</label><select class="form-select" name="department"><option value="">No department</option>{% for department in departments %}<option value="{{ department.id }}" {% if employee.department_id == department.id %}selected{% endif %}>{{ department.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Designation</label><input class="form-control" name="designation" value="{{ employee.designation|default:'' }}"></div><div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status"><option value="Active" {% if employee.status == 'Active' %}selected{% endif %}>Active</option><option value="Inactive" {% if employee.status == 'Inactive' %}selected{% endif %}>Inactive</option></select></div></div><div class="mt-4"><button class="btn btn-primary"><i class="bi bi-check2"></i> Save Changes</button><a class="btn btn-light ms-2" href="{% url 'employee_management' %}">Cancel</a></div></form></div>{% endblock %}
