{% extends 'admin/base.html' %}{% block content %}<h2>Edit Employee</h2><form method="post" class="card p-4">{% csrf_token %}<input class="form-control mb-2" name="name" value="{{ employee.name }}" placeholder="Name"><input class="form-control mb-2" name="email" value="{{ employee.email }}" placeholder="Email"><input class="form-control mb-2" name="phone" value="{{ employee.phone }}" placeholder="Phone"><input class="form-control mb-2" name="designation" value="{{ assignment.designation|default:'' }}" placeholder="Designation"><select class="form-select mb-2" name="department"><option value="">No department</option>{% for d in departments %}<option value="{{ d.id }}" {% if assignment.department.id == d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select><select class="form-select mb-3" name="status"><option {% if employee.status == 'Active' %}selected{% endif %}>Active</option><option {% if employee.status == 'Inactive' %}selected{% endif %}>Inactive</option></select><button class="btn btn-primary">Save</button></form>{% endblock %}
