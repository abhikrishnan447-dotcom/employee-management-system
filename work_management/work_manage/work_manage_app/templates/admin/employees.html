{% extends 'admin/base.html' %}{% block content %}<h2>Employee Management</h2><div class="table-responsive"><table class="table table-bordered bg-white"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead><tbody>{% for e in employees %}<tr><td>{{ e.name }}</td><td>{{ e.email }}</td><td>{{ e.phone }}</td><td>{{ e.status }}</td><td><a class="btn btn-sm btn-primary" href="{% url 'employee_edit' e.id %}">Edit</a></td></tr>{% empty %}<tr><td colspan="5">No employees.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
