{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | WorkSphere</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;font-family:Poppins,sans-serif;background:#ffedce;color:#20242c;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
        .admin-page{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
        .shape{position:absolute;border-radius:50%;z-index:0}
        .shape-one{width:360px;height:360px;background:rgba(255,193,147,.55);top:-190px;left:-130px}
        .shape-two{width:330px;height:330px;background:rgba(255,131,131,.38);bottom:-180px;right:-110px}
        .shape-three{width:180px;height:180px;background:rgba(255,55,55,.14);top:12%;right:8%}
        .login-card{position:relative;z-index:1;width:100%;max-width:500px;background:#fff;border-radius:28px;padding:48px 52px;box-shadow:0 24px 65px rgba(180,90,65,.18);border:1px solid rgba(255,255,255,.8)}
        .admin-icon{width:58px;height:58px;border-radius:16px;background:#ff3737;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;margin-bottom:22px;box-shadow:0 10px 25px rgba(255,55,55,.22)}
        h1{font-size:30px;line-height:1.25;font-weight:800;margin:0 0 8px;color:#20242c}
        .subtitle{margin:0 0 30px;color:#858a94;font-size:14px}
        .form-label{display:block;font-size:13px;font-weight:600;color:#383d46;margin-bottom:8px}
        .input-wrap{position:relative;margin-bottom:20px}
        .input-wrap>i.field-icon{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:#a1a5ad;font-size:16px;z-index:2}
        .form-control{width:100%;height:53px;border:1px solid #e5e1dc;border-radius:12px;padding:0 48px;font-size:14px;font-family:Poppins,sans-serif;outline:none;background:#fff;transition:.2s ease}
        .form-control:focus{border-color:#ff8383;box-shadow:0 0 0 4px rgba(255,131,131,.14)}
        .password-toggle{position:absolute;right:15px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#9da1aa;padding:4px;cursor:pointer;font-size:16px}
        .password-toggle:hover{color:#ff3737}
        .login-btn{width:100%;height:53px;border:0;border-radius:12px;background:#ff3737;color:#fff;font-family:Poppins,sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:.25s ease;margin-top:5px}
        .login-btn:hover{background:#ed2929;transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,55,55,.22)}
        .error-message{background:#fff0ee;color:#d84b4b;border:1px solid #ffd0ca;padding:10px 13px;border-radius:10px;font-size:13px;margin-bottom:18px}
        .back-home{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:23px;color:#7d828c;text-decoration:none;font-size:13px}
        .back-home:hover{color:#ff3737}
        @media(max-width:560px){body{padding:15px}.login-card{padding:36px 25px;border-radius:22px}h1{font-size:26px}.shape-three{display:none}}
    </style>
</head>
<body>
<div class="admin-page">
    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>
    <div class="shape shape-three"></div>

    <div class="login-card">
        <div class="admin-icon"><i class="bi bi-shield-lock-fill"></i></div>
        <h1>Admin Login</h1>
        <p class="subtitle">Sign in to access the administrator workspace.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="error-message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label class="form-label" for="email">Email Address</label>
            <div class="input-wrap">
                <i class="bi bi-envelope field-icon"></i>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required autocomplete="email">
            </div>

            <label class="form-label" for="password">Password</label>
            <div class="input-wrap">
                <i class="bi bi-lock field-icon"></i>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Show password">
                    <i class="bi bi-eye" id="passwordIcon"></i>
                </button>
            </div>

            <button type="submit" class="login-btn">Sign In <i class="bi bi-arrow-right ms-1"></i></button>
        </form>

        <a href="{% url 'index' %}" class="back-home"><i class="bi bi-arrow-left"></i> Back to Home</a>
    </div>
</div>
<script>
function togglePassword(){const input=document.getElementById('password');const icon=document.getElementById('passwordIcon');const visible=input.type==='text';input.type=visible?'password':'text';icon.className=visible?'bi bi-eye':'bi bi-eye-slash';}
</script>
</body>
</html>
