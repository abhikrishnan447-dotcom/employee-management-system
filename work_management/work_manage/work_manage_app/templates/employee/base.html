<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee | Work Management</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container-fluid"><a class="navbar-brand" href="{% url 'dashboard' %}">Employee Portal</a><a class="btn btn-light btn-sm" href="{% url 'logout' %}">Logout</a></div></nav><div class="container py-4"><div class="d-flex flex-wrap gap-2 mb-4"><a class="btn btn-outline-primary" href="{% url 'dashboard' %}">Dashboard</a><a class="btn btn-outline-primary" href="{% url 'employee_tasks' %}">My Tasks</a><a class="btn btn-outline-primary" href="{% url 'notifications' %}">Notifications</a><a class="btn btn-outline-primary" href="{% url 'messages' %}">Messages</a><a class="btn btn-outline-primary" href="{% url 'profile' %}">Profile</a><a class="btn btn-outline-primary" href="{% url 'settings' %}">Settings</a></div>{% if messages %}{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</div></body></html>
