{% extends 'employee/base.html' %}{% block content %}<h2>My Profile</h2><form method="post" enctype="multipart/form-data" class="card card-body" style="max-width:600px">{% csrf_token %}<input class="form-control mb-2" name="name" value="{{ user.name }}" required><input class="form-control mb-2" name="phone" value="{{ user.phone }}" required><input class="form-control mb-3" type="file" name="profile_photo" accept="image/*"><p>Email: {{ user.email }}</p><button class="btn btn-primary">Save Profile</button></form>{% endblock %}
