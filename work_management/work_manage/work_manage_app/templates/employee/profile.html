{% extends 'employee/base.html' %}{% block title %}Profile | WorkSphere{% endblock %}{% block content %}<div class="page-title mb-4"><h1>My Profile</h1><p>Update your personal information.</p></div><div class="card-pro p-4"><form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ user.name }}" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ user.phone }}" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" value="{{ user.email }}" disabled></div><div class="col-md-6"><label class="form-label">Department</label><input class="form-control" value="{{ user.department.name|default:'Not assigned' }}" disabled></div><div class="col-12"><label class="form-label">Profile Photo</label><input class="form-control" type="file" name="profile_photo" accept="image/*"></div></div><button class="btn btn-primary mt-4"><i class="bi bi-check2"></i> Save Profile</button></form></div>{% endblock %}
