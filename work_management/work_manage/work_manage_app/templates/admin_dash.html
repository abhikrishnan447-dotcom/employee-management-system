{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        .header{
            width:100%;
            background:#2c3e50;
            color:#fff;
            padding:20px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .header h2{
            font-size:28px;
        }

        .logout a{
            text-decoration:none;
            color:#fff;
            background:red;
            padding:10px 18px;
            border-radius:5px;
        }

        .container{
            width:90%;
            margin:40px auto;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            border-radius:10px;
            padding:25px;
            box-shadow:0 0 10px rgba(0,0,0,.15);
            text-align:center;
        }

        .card h3{
            color:#555;
            margin-bottom:15px;
        }

        .card h1{
            color:#2c3e50;
            font-size:40px;
        }

        .menu{
            margin-top:40px;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
        }

        .menu a{
            text-decoration:none;
            background:#3498db;
            color:white;
            padding:18px;
            border-radius:8px;
            text-align:center;
            font-size:18px;
            transition:.3s;
        }

        .menu a:hover{
            background:#21618c;
        }
    </style>

</head>
<body>

<div class="header">
    <h2>Admin Dashboard</h2>

    <div class="logout">
        <a href="{% url 'adminlogout' %}">Logout</a>
    </div>
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <h3>Total Employees</h3>
              <a href="{% url 'employee_list' %}" style="text-decoration:none;color:black;">
            <h1>{{ total_employees }}</h1>
        </div>

         <div class="card">
            <h3>Total Departments</h3>
            <h1>{{ total_departments }}</h1>
        </div>

        <div class="card">
            <h3>Total Tasks</h3>
            <h1>{{ total_tasks }}</h1>
        </div>

        <div class="card">
            <h3>Completed Tasks</h3>
            <h1>{{ completed_tasks }}</h1>
        </div>

        <div class="card">
            <h3>Pending Tasks</h3>
            <h1>{{ pending_tasks }}</h1>
        </div>

        <div class="card">
            <h3>Extension Requests</h3>
            <h1>{{ extension_requests }}</h1>
        </div>

    </div>


</div>

</body>
</html>
