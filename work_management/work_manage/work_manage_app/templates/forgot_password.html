{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | WorkSphere</title>
<link rel="icon" href="{% static 'images/favicon.png' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#f7f8fc;font-family:Poppins,Arial,sans-serif;color:#20242c;display:flex;align-items:center;justify-content:center;padding:20px}.reset-card{width:100%;max-width:480px;background:#fff;border-radius:24px;padding:42px;box-shadow:0 20px 60px rgba(25,30,45,.1)}.brand{display:block;text-align:center;text-decoration:none;color:#20242c;font-size:25px;font-weight:800;margin-bottom:28px}.brand span{color:#ef5b5b}.icon{width:64px;height:64px;border-radius:18px;background:#fff0ee;color:#ef5b5b;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px}.title{text-align:center}.title h1{font-size:28px;font-weight:700}.title p{color:#777d87;font-size:14px;line-height:1.7}.form-label{font-size:13px;font-weight:600}.form-control{height:52px;border-radius:12px}.btn-main{height:52px;border:0;border-radius:12px;background:#ef5b5b;color:#fff;font-weight:600;width:100%}.back{display:block;text-align:center;margin-top:20px;color:#777d87;text-decoration:none;font-size:13px}.alert{font-size:13px}
</style>
</head>
<body>
<div class="reset-card">
<a class="brand" href="{% url 'index' %}">Work<span>Sphere</span></a>
<div class="icon"><i class="bi bi-shield-lock"></i></div>
<div class="title"><h1>Create New Password</h1><p>Enter your registered email and create a new password directly on this website.</p></div>
{% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% endif %}
<form method="post">
{% csrf_token %}
<label class="form-label" for="email">Registered Email Address</label>
<input type="email" class="form-control mb-3" id="email" name="email" placeholder="Enter your registered email" required autocomplete="email">
<label class="form-label" for="password">New Password</label>
<input type="password" class="form-control mb-3" id="password" name="password" placeholder="Enter new password" minlength="8" required autocomplete="new-password">
<label class="form-label" for="confirm_password">Confirm New Password</label>
<input type="password" class="form-control mb-4" id="confirm_password" name="confirm_password" placeholder="Confirm new password" minlength="8" required autocomplete="new-password">
<button class="btn-main" type="submit">Change Password <i class="bi bi-check2"></i></button>
</form>
<a class="back" href="{% url 'login' %}"><i class="bi bi-arrow-left"></i> Back to Login</a>
</div>
</body>
</html>
