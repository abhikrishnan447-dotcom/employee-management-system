{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
        }

        .login-box{
            width:380px;
            background:#fff;
            padding:35px;
            border-radius:10px;
            box-shadow:0 0 20px rgba(0,0,0,.3);
        }

        .login-box h2{
            text-align:center;
            margin-bottom:30px;
            color:#2c3e50;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:5px;
            outline:none;
            font-size:16px;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:5px;
            background:#2c3e50;
            color:#fff;
            font-size:18px;
            cursor:pointer;
        }

        .btn:hover{
            background:#1a252f;
        }

        .error{
            background:#ffe5e5;
            color:red;
            padding:10px;
            border-radius:5px;
            margin-bottom:15px;
            text-align:center;
        }

    </style>

</head>
<body>

<div class="login-box">

    <h2><i class="fa-solid fa-user-shield"></i> Admin Login</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="error">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-box">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit" class="btn">
            Login
        </button>

    </form>

</div>

</body>
</html>
